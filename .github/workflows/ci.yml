name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Test unitaires (zéro dépendance)
        run: python -m unittest discover -s tests -v
        working-directory: verify-bounty
      - name: Vérification compilation
        run: python -m compileall -q verify-bounty
